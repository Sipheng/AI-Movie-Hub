<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Movie Hub</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root { --bg: #dceee4; --ink: #22543d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background-color: #ffffff;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px clamp(20px, 4vw, 56px);
    border-bottom: 1px solid rgba(0,0,0,.08);
  }
  .logo {
    width: clamp(40px, 4vw, 56px);
    height: clamp(40px, 4vw, 56px);
    border-radius: 14px;
    box-shadow: 0 3px 8px rgba(0,0,0,.18);
  }
  .brand {
    font-size: clamp(24px, 3vw, 38px);
    font-weight: 800;
    letter-spacing: .5px;
    color: #2f8a55;
    text-align: center;
  }
  .header-content { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
  .movie-search { display: flex; gap: 8px; width: min(620px, 100%); }
  .movie-search input {
    flex: 1; min-width: 0; padding: 12px 15px; border: 1px solid #b8d9c5;
    border-radius: 12px; font: inherit; font-size: 16px; color: #22543d; background: #fff;
    outline-offset: 2px;
  }
  .movie-search button {
    border: 0; border-radius: 12px; padding: 12px 20px; font: inherit; font-weight: 700;
    color: #fff; background: linear-gradient(135deg, #52b97c, #2f8a55); cursor: pointer;
  }
  .movie-search button:hover, .movie-search button:focus-visible { filter: brightness(1.08); }
  .search-help { margin: -6px 0 0; color: rgba(34,84,61,.7); text-align: center; font-size: 13px; }
  @media (max-width: 480px) { .movie-search { gap: 6px; } .movie-search button { padding: 11px 13px; } }

  /* ---------- Sections ---------- */
  main { padding: clamp(16px, 3vw, 36px); }
  .section { max-width: 1600px; margin: 0 auto; scroll-margin-top: 90px; }
  .section + .section { margin-top: clamp(22px, 3vw, 40px); }
  .section-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 4px 2px 16px;
  }
  .section-head h2 {
    margin: 0;
    font-size: clamp(16px, 1.8vw, 22px);
    font-weight: 800;
    color: #22543d;
    white-space: nowrap;
  }
  .section-head .rule {
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, rgba(34,84,61,.35), rgba(34,84,61,0));
    border-radius: 2px;
  }
  .section-head .count {
    font-size: 13px;
    font-weight: 600;
    color: rgba(34,84,61,.6);
  }

  /* ---------- Responsive grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: clamp(10px, 1.2vw, 16px);
  }

  /* On tablet and mobile show exactly 3 tiles per row */
  @media (max-width: 1024px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .tile { min-height: 72px; padding: 12px 10px; font-size: clamp(12px, 2.4vw, 16px); border-radius: 14px; }
    .tile .arrow { top: 8px; right: 9px; font-size: 12px; }
  }

  /* ---------- Tiles ---------- */
  .tile {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 92px;
    padding: 16px 16px;
    border-radius: 18px;
    text-decoration: none;
    color: #fff;
    font-size: clamp(14px, 1.3vw, 18px);
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,.18);
    box-shadow: 0 6px 14px rgba(0,0,0,.12);
    transition: transform .15s ease, box-shadow .15s ease, outline-color .15s ease, filter .15s ease;
    outline: 3px solid transparent;
    outline-offset: 2px;
  }
  .tile .arrow {
    position: absolute;
    top: 11px; right: 15px;
    font-size: 15px;
    opacity: .9;
  }
  .tile:hover,
  .tile:focus-visible {
    transform: translateY(-3px);
    box-shadow: 0 12px 22px rgba(0,0,0,.22);
    filter: brightness(1.06);
    outline-color: #ffffff;
  }
  .tile:active { transform: translateY(-1px); }

  footer {
    text-align: center;
    padding: 24px 16px 40px;
    color: rgba(34, 84, 61, .6);
    font-size: 13px;
  }

  /* ---------- Floating jump navigation ---------- */
  .jump {
    position: fixed;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 50;
    opacity: .45;
    transition: top .22s ease, left .22s ease, right .22s ease, bottom .22s ease, transform .22s ease, opacity .2s ease;
    will-change: top, left, right, bottom, transform;
  }
  .jump:hover { opacity: 1; }
  .jump a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px; height: 48px;
    border-radius: 50%;
    text-decoration: none;
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    background: linear-gradient(135deg, #52b97c, #2f8a55);
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    transition: transform .15s ease, width .2s ease, box-shadow .15s ease;
    position: relative;
  }
  .jump a:hover,
  .jump a:focus-visible {
    transform: scale(1.08);
    box-shadow: 0 8px 18px rgba(0,0,0,.28);
    outline: none;
  }
  /* Label that slides out on hover */
  .jump a .lbl {
    position: absolute;
    right: 56px;
    white-space: nowrap;
    background: #2f8a55;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transform: translateX(8px);
    transition: opacity .15s ease, transform .15s ease;
  }
  .jump a:hover .lbl,
  .jump a:focus-visible .lbl { opacity: 1; transform: translateX(0); }

  @media (max-width: 1024px) {
    .jump { right: 10px; gap: 8px; }
    .jump a { width: 40px; height: 40px; font-size: 15px; }
  }
</style>
</head>
<body>
  <header>
    <div class="header-content">
      <img class="logo" src="icon.png" alt="AI Movie Hub logo" />
      <div class="brand">AI Movie Hub</div>
      <form class="movie-search" id="movieSearchForm" role="search">
        <input id="movieTitle" type="search" placeholder="Enter movie title (e.g. Funny AI)" aria-label="Movie title" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <p class="search-help">Search applies to chartdrama and dramafren websites. Enter a title, search, then choose a website box.</p>
    </div>
  </header>

  <main id="app"></main>

  <!-- Floating navigation: jump to Top / Middle / Bottom sections -->
  <nav class="jump" aria-label="Jump to section">
    <a href="#top"><span class="lbl">Top</span>&#8593;</a>
    <a href="#middle"><span class="lbl">Middle</span>&#8226;</a>
    <a href="#bottom"><span class="lbl">Bottom</span>&#8595;</a>
  </nav>

  <footer>Select a tile to open the website. Use the remote D-pad / arrow keys and Enter on a TV.</footer>

  <script>
    // ---- Top section: Featured ----
    var movieSearchTerm = "";

    document.getElementById("movieSearchForm").addEventListener("submit", function (event) {
      event.preventDefault();
      movieSearchTerm = document.getElementById("movieTitle").value.trim();
      var help = document.querySelector(".search-help");
      help.textContent = movieSearchTerm
        ? 'Search ready for “' + movieSearchTerm + '”. Now click a box in chartdrama or dramafren.'
        : 'Search cleared. Website boxes will open their normal homepages.';
    });

    var GROUP_TOP = [
      { name: "KissKH",    url: "https://kisskh.co/" },
      { name: "KhFullHD",  url: "https://khfullhd.co/" },
      { name: "MovieNova", url: "https://movienova.sc/" },
      { name: "Olevod",    url: "https://olevod.com/" }
    ];

    // ---- Featured providers ----
    var GROUP_PROVIDERS = [
      { name: "WeTV",    url: "https://reelfren.com/explore?provider=wetv&lang=en" },
      { name: "iQIYI",   url: "https://reelfren.com/explore?provider=iqiyi&lang=en" },
      { name: "FilmBox", url: "https://reelfren.com/explore?provider=filmbox&lang=en" }
    ];

    // ---- Group 1: chartdrama ----
    var GROUP_CHARTDRAMA = [
      { name: "chartdrama",   url: "https://chartdrama.com/" },
      { name: "reelshort",    url: "https://reelshort.chartdrama.com/" },
      { name: "dramabox",     url: "https://dramabox.chartdrama.com/" },
      { name: "netshort",     url: "https://netshort.chartdrama.com/" },
      { name: "goodshort",    url: "https://goodshort.chartdrama.com/" },
      { name: "dramawave",    url: "https://dramawave.chartdrama.com/" },
      { name: "shortmax",     url: "https://shortmax.chartdrama.com/" },
      { name: "4drama",       url: "https://4drama.chartdrama.com/" },
      { name: "stardusttv",   url: "https://stardusttv.chartdrama.com/" },
      { name: "reereels",     url: "https://freereels.chartdrama.com/" },
      { name: "starshort",    url: "https://starshort.chartdrama.com/" },
      { name: "tastelife",    url: "https://tastelife.chartdrama.com/" },
      { name: "shotshort",    url: "https://shotshort.chartdrama.com/" },
      { name: "dramatv",      url: "https://dramatv.chartdrama.com/" },
      { name: "flextv",       url: "https://flextv.chartdrama.com/" },
      { name: "shorts",       url: "https://shorts.chartdrama.com/" },
      { name: "novafilck",    url: "https://novafilck.chartdrama.com/" },
      { name: "thisreels",    url: "https://thisreels.chartdrama.com/" },
      { name: "sodatv",       url: "https://sodatv.chartdrama.com/" },
      { name: "kalostv",      url: "https://kalostv.chartdrama.com/" },
      { name: "muvpix",       url: "https://muvpix.chartdrama.com/" },
      { name: "toonory",      url: "https://toonory.chartdrama.com/" },
      { name: "aurareels",    url: "https://aurareels.chartdrama.com/" },
      { name: "venixtv",      url: "https://venixtv.chartdrama.com/" },
      { name: "starreel",     url: "https://starreel.chartdrama.com/" },
      { name: "leapreels",    url: "https://leapreels.chartdrama.com/" },
      { name: "flareflow",    url: "https://flareflow.chartdrama.com/" },
      { name: "joyreels",     url: "https://joyreels.chartdrama.com/" },
      { name: "ziptaletv",    url: "https://ziptaletv.chartdrama.com/" },
      { name: "vyntage",      url: "https://vyntage.chartdrama.com/" },
      { name: "swoopreels",   url: "https://swoopreels.chartdrama.com/" },
      { name: "flikso",       url: "https://flikso.chartdrama.com/" },
      { name: "rivoshort",    url: "https://rivoshort.chartdrama.com/" },
      { name: "ersevoyagetv", url: "https://versevoyagetv.chartdrama.com/" },
      { name: "cubetv",       url: "https://cubetv.chartdrama.com/" },
      { name: "sanpplay",     url: "https://sanpplay.chartdrama.com/" },
      { name: "nebuluxe",     url: "https://nebuluxe.chartdrama.com/" },
      { name: "lunory",       url: "https://lunory.chartdrama.com/" },
      { name: "myrelle",      url: "https://myrelle.chartdrama.com/" },
      { name: "pinedrama",    url: "https://pinedrama.chartdrama.com/" },
      { name: "dramabite",    url: "https://dramabite.chartdrama.com/" },
      { name: "raptdrama",    url: "https://raptdrama.chartdrama.com/" },
      { name: "plotify",      url: "https://plotify.chartdrama.com/" }
    ];

    // ---- Group 2: dramafren ----
    var GROUP_DRAMAFREN = [
      { name: "dramafren",   url: "https://dramafren.org/" },
      { name: "dramabox",    url: "https://dramabox.dramafren.org/" },
      { name: "goodshort",   url: "https://goodshort.dramafren.org/" },
      { name: "netshort",    url: "https://netshort.dramafren.org/" },
      { name: "flickreels",  url: "https://flickreels.dramafren.org/" },
      { name: "stardusttv",  url: "https://stardusttv.dramafren.org/" },
      { name: "dramawave",   url: "https://dramawave.dramafren.org/" },
      { name: "shortmax",    url: "https://shortmax.dramafren.org/" },
      { name: "hortmaxv2",   url: "https://shortmaxv2.shorttw.live/" },
      { name: "reelshort",   url: "https://reelshort.dramafren.org/" },
      { name: "idrama",      url: "https://idrama.dramafren.org/" },
      { name: "flextv",      url: "https://flextv.dramafren.org/" },
      { name: "starshort",   url: "https://starshort.dramafren.org/" },
      { name: "kalostv",     url: "https://kalostv.dramafren.org/" },
      { name: "dramabite",   url: "https://dramabite.dramafren.org/" },
      { name: "microdrama",  url: "https://microdrama.dramafren.org/" },
      { name: "shortwave",   url: "https://shortwave.dramafren.org/" },
      { name: "tvseries",    url: "https://tvseries.dramafren.org/" },
      { name: "moboreels",   url: "https://moboreels.dramafren.org/" },
      { name: "reelfren",    url: "https://reelfren.com/" }
    ];

    // A curated, harmonious color palette. Each tile picks one gradient from
    // this palette (cycled by position) so the boxes look coordinated on the
    // white background while staying distinct and easy to read.
    var PALETTE = [
      ["#14B8A6", "#0D9488"], // teal
      ["#3B82F6", "#2563EB"], // blue
      ["#6366F1", "#4F46E5"], // indigo
      ["#8B5CF6", "#7C3AED"], // violet
      ["#A855F7", "#9333EA"], // purple
      ["#EC4899", "#DB2777"], // pink
      ["#F43F5E", "#E11D48"], // rose
      ["#F97316", "#EA580C"], // orange
      ["#22C55E", "#16A34A"], // green
      ["#10B981", "#059669"], // emerald
      ["#06B6D4", "#0891B2"], // cyan
      ["#0EA5E9", "#0284C7"]  // sky
    ];
    function tileColors(i) {
      var pair = PALETTE[i % PALETTE.length];
      return "linear-gradient(90deg, " + pair[0] + ", " + pair[1] + ")";
    }

    function buildTile(site, colorIndex, searchGroup) {
      var a = document.createElement("a");
      a.className = "tile";
      a.href = site.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.background = tileColors(colorIndex);
      a.addEventListener("click", function (event) {
        if (!movieSearchTerm || !searchGroup) return;
        event.preventDefault();
        var target = new URL(site.url);
        if (searchGroup === "chartdrama") {
          target.pathname = target.pathname.replace(/\/$/, "") + "/search";
          target.search = "?q=" + encodeURIComponent(movieSearchTerm).replace(/%20/g, "+");
          target.hash = "";
        } else if (searchGroup === "dramafren") {
          target.pathname = "/index.php";
          target.search = "?page=search_result&q=" + encodeURIComponent(movieSearchTerm).replace(/%20/g, "+") + "&lang=en";
          target.hash = "";
        }
        window.open(target.href, "_blank", "noopener,noreferrer");
      });

      var label = document.createElement("span");
      label.textContent = site.name;   // text only — safe, no HTML injection

      var arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "\u2197";

      a.appendChild(label);
      a.appendChild(arrow);
      return a;
    }

    function buildSection(title, sites, startColorIndex, id, searchGroup) {
      var section = document.createElement("section");
      section.className = "section";
      if (id) { section.id = id; }

      var head = document.createElement("div");
      head.className = "section-head";
      var h2 = document.createElement("h2");
      h2.textContent = title;
      var rule = document.createElement("div");
      rule.className = "rule";
      var count = document.createElement("span");
      count.className = "count";
      count.textContent = sites.length + " sites";
      head.appendChild(h2);
      head.appendChild(rule);
      head.appendChild(count);

      var grid = document.createElement("nav");
      grid.className = "grid";
      grid.setAttribute("aria-label", title);
      sites.forEach(function (site, idx) {
        grid.appendChild(buildTile(site, startColorIndex + idx, searchGroup));
      });

      section.appendChild(head);
      section.appendChild(grid);
      return section;
    }

    (function render() {
      var app = document.getElementById("app");
      app.appendChild(buildSection("Featured", GROUP_TOP, 3, "top"));
      app.appendChild(buildSection("Featured Providers", GROUP_PROVIDERS, 0, "featured-providers"));
      app.appendChild(buildSection("chartdrama", GROUP_CHARTDRAMA, 0, "middle", "chartdrama"));
      app.appendChild(buildSection("dramafren", GROUP_DRAMAFREN, 7, "bottom", "dramafren"));
    })();

    // The floating jump nav reacts to the mouse by snapping to whichever
    // screen edge the cursor is nearest to (left / right / top / bottom). It
    // anchors to the MIDDLE of that edge — it does NOT track the pointer
    // continuously — so it never dodges the cursor and every button stays
    // clickable. It also freezes while you are hovering over it.
    (function followMouse() {
      var jump = document.querySelector(".jump");
      if (!jump) return;

      var EDGE = 18;
      var current = "right";
      var frozen = false;
      var pending = null;

      function apply(edge) {
        jump.style.left = "auto";
        jump.style.right = "auto";
        jump.style.top = "auto";
        jump.style.bottom = "auto";
        if (edge === "left" || edge === "right") {
          jump.style.flexDirection = "column";
          jump.style.top = "50%";
          jump.style.transform = "translateY(-50%)";
          jump.style[edge] = EDGE + "px";
        } else {
          jump.style.flexDirection = "row";
          jump.style.left = "50%";
          jump.style.transform = "translateX(-50%)";
          jump.style[edge] = EDGE + "px";
        }
      }
      apply(current);

      function pick(mx, my) {
        var vw = window.innerWidth, vh = window.innerHeight;
        var d = { left: mx, right: vw - mx, top: my, bottom: vh - my };
        var edge = "right", best = Infinity;
        for (var k in d) { if (d[k] < best) { best = d[k]; edge = k; } }
        if (edge !== current) { current = edge; apply(edge); }
      }

      window.addEventListener("mousemove", function (e) {
        if (frozen || pending) return;
        pending = requestAnimationFrame(function () {
          pending = null;
          pick(e.clientX, e.clientY);
        });
      });

      // Freeze the position while the pointer is on the nav so clicks land.
      jump.addEventListener("mouseenter", function () { frozen = true; });
      jump.addEventListener("mouseleave", function () { frozen = false; });
    })();
  </script>
</body>
</html>
